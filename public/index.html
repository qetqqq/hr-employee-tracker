<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Учёт сотрудников</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header class="header">
    <div class="container header-content">
        <div>
            <h1>Кадровый учёт сотрудников</h1>
            <p class="subtitle">Панель управления персоналом организации</p>
        </div>
        <button id="btnAddEmployee" class="btn btn-primary">+ Добавить сотрудника</button>
    </div>
</header>

<main class="container">
    <!-- Панель поиска и фильтров -->
    <section class="filters-panel">
        <div class="filter-group search-group">
            <label for="searchInput">Поиск по ФИО</label>
            <input
                    type="text"
                    id="searchInput"
                    placeholder="Введите фамилию, имя или отчество..."
                    autocomplete="off"
            />
        </div>

        <div class="filter-group">
            <label for="filterDepartment">Отдел</label>
            <select id="filterDepartment">
                <option value="">Все отделы</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filterPosition">Должность</label>
            <select id="filterPosition">
                <option value="">Все должности</option>
            </select>
        </div>

        <div class="filter-actions">
            <button id="btnResetFilters" class="btn btn-secondary">Сбросить</button>
        </div>
    </section>

    <!-- Таблица сотрудников -->
    <section class="table-wrapper">
        <table class="employees-table">
            <thead>
            <tr>
                <th>ФИО</th>
                <th>Дата рождения</th>
                <th>Паспорт</th>
                <th>Телефон</th>
                <th>Адрес проживания</th>
                <th>Отдел</th>
                <th>Должность</th>
                <th>Зарплата</th>
                <th>Дата приёма</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody id="employeesTableBody">
            <tr>
                <td colspan="11" class="empty-state">Загрузка данных...</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<!-- Модальное окно создания / редактирования -->
<div id="employeeModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Новый сотрудник</h2>
            <button id="btnCloseModal" class="btn-close" aria-label="Закрыть">&times;</button>
        </div>

        <form id="employeeForm">
            <input type="hidden" id="employeeId" />

            <div id="formErrors" class="form-errors hidden"></div>

            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="fullName">ФИО *</label>
                    <input type="text" id="fullName" required placeholder="Иванов Иван Иванович" />
                </div>

                <div class="form-group">
                    <label for="birthDate">Дата рождения *</label>
                    <input type="date" id="birthDate" required />
                </div>

                <div class="form-group">
                    <label for="hireDate">Дата принятия на работу *</label>
                    <input type="date" id="hireDate" required />
                </div>

                <div class="form-group">
                    <label for="passport">Серия и номер паспорта *</label>
                    <input
                            type="text"
                            id="passport"
                            required
                            placeholder="0000 000000"
                            maxlength="11"
                    />
                </div>

                <div class="form-group">
                    <label for="phone">Контактный телефон *</label>
                    <input
                            type="text"
                            id="phone"
                            required
                            placeholder="+7 (000) 000-00-00"
                            maxlength="18"
                    />
                </div>

                <div class="form-group">
                    <label for="departmentId">Отдел *</label>
                    <select id="departmentId" required>
                        <option value="">Выберите отдел</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="positionId">Должность *</label>
                    <select id="positionId" required>
                        <option value="">Выберите должность</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="salary">Размер зарплаты (₽) *</label>
                    <input type="number" id="salary" required min="0" step="100" placeholder="100000" />
                </div>

                <div class="form-group full-width">
                    <label for="address">Адрес проживания *</label>
                    <input
                            type="text"
                            id="address"
                            required
                            placeholder="г. Москва, ул. Примерная, д. 1, кв. 1"
                    />
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" id="btnCancelModal" class="btn btn-secondary">Отмена</button>
                <button type="submit" class="btn btn-primary" id="btnSaveEmployee">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/masks.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
